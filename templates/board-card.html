<div id="zcode-swarm-board" class="card">

  #zcode-swarm-board[data-zoom="true"] .zb-detail .zb-dsec-text, #zcode-swarm-board[data-zoom="true"] .zb-detail .zb-dlist { font-size: 13px; }
  #zcode-swarm-board[data-zoom="true"] .zb-warn summary, #zcode-swarm-board[data-zoom="true"] .zb-warn li { font-size: 13px; }
  #zcode-swarm-board h3, #zcode-swarm-board .zb-nums, #zcode-swarm-board .zb-title, #zcode-swarm-board .zb-segbar, #zcode-swarm-board .zb-row, #zcode-swarm-board .zb-grid { transition: font-size 0.25s ease, gap 0.25s ease, padding 0.25s ease, height 0.25s ease; }

  #zcode-swarm-board .zb-row[data-status="pending"] .zb-icon { animation: zb-breath 2.5s ease-in-out infinite alternate; }

<script>
(function () {
  /* root 定位优先从脚本自身向上找（脚本在 root div 内部）——彻底免疫同文档多卡片/重复 id：
     getElementById 在宿主把多张 ::visualize 卡片渲染进同一文档时会命中更早的旧卡片，

    var sc = document.currentScript;
    for (var n = sc && sc.parentNode; n; n = n.parentNode) {
      if (n.id === "zcode-swarm-board") return n;
    }
    return document.getElementById("zcode-swarm-board");
  })();
  var DATA = /*@@DATA@@*/null/*@@END@@*/;

  var $ = function (id) { return root ? root.querySelector("#" + id) : null; };
  function need(el, name) { if (!el) throw new Error("卡片骨架缺 #" + name + "（宿主可能清洗了结构）"); return el; }
  function cut(v, n) { var s = String(v == null ? "" : v); return s.length > n ? s.slice(0, n) + "…" : s; }
  function pick(o, keys) { if (!o) return ""; for (var i = 0; i < keys.length; i++) { var v = o[keys[i]]; if (v !== undefined && v !== null && v !== "") return v; } return ""; }
  /* 全部节点用 DOM API + textContent 构建——无可信内容进 innerHTML，无转义负担 */
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  var SVG_NS = "http://www.w3.org/2000/svg";
  function svgIcon(size, sw, paths) {
    var s = document.createElementNS(SVG_NS, "svg");
    s.setAttribute("viewBox", "0 0 14 14"); s.setAttribute("width", size); s.setAttribute("height", size);
    s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
    s.setAttribute("stroke-width", sw); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
    paths.forEach(function (p) { var e = document.createElementNS(SVG_NS, p[0]); for (var k in p[1]) e.setAttribute(k, p[1][k]); s.appendChild(e); });
    return s;
  }
  var ICON_SVG = {
    pending: function () { return svgIcon(14, 1.5, [["circle", { cx: 7, cy: 7, r: 5.5 }], ["path", { d: "M7 4v3l2.5 2.5" }]]); },
    rework: function () { return svgIcon(14, 1.5, [["path", { d: "M12 7a5 5 0 1 1-1.5-3.5" }], ["path", { d: "M12 1v3h-3" }]]); },
    passed: function () { return svgIcon(14, 2, [["path", { d: "M2.5 7.5l3 3 6-7" }]]); },
    failed: function () { return svgIcon(14, 2, [["path", { d: "M3 3l8 8M11 3l-8 8" }]]); }
  };
  function iconOf(st) {
    if (st === "working") {
      var w = el("span", "zb-spinner"); w.setAttribute("aria-hidden", "true");
      w.appendChild(el("i")); w.appendChild(el("i")); w.appendChild(el("i")); w.appendChild(el("i"));
      return w;
    }
    if (st === "reviewing") {
      var r = el("span", "zb-scan"); r.setAttribute("aria-hidden", "true");
      r.appendChild(svgIcon(13, 1.5, [["circle", { cx: 6, cy: 6, r: 4 }], ["path", { d: "M9.5 9.5L13 13" }]]));
      return r;
    }
    return (ICON_SVG[st] || ICON_SVG.pending)();
  }

  var STATE_LABEL = { pending: "待开工", working: "施工中", reviewing: "审查中", rework: "返工中", passed: "已通过", failed: "未通过" };
  var STAGES = {
    pending: "pending", "待开工": "pending", "待施工": "pending", queued: "pending", wait: "pending",
    working: "working", building: "working", "施工中": "working",
    reviewing: "reviewing", review: "reviewing", "审查中": "reviewing",
    rework: "rework", reworking: "rework", "返工中": "rework", "返工": "rework",
    passed: "passed", pass: "passed", ok: "passed", "通过": "passed", "已通过": "passed",
    failed: "failed", fail: "failed", error: "failed", "未通过": "failed"
  };
  function normStatus(v) { return STAGES[String(v == null ? "" : v).trim().toLowerCase()] || "pending"; }

  var RUNS = {
    running: "running", run: "running", "运行中": "running", "进行中": "running",
    completed: "completed", complete: "completed", done: "completed", "已完成": "completed", "完成": "completed",
    failed: "failed", fail: "failed", error: "failed", "失败": "failed",
    stopped: "stopped", stop: "stopped", cancelled: "stopped", "已停止": "stopped",
    pending: "pending", "待启动": "pending"
  };
  var RUN_LABEL = { running: "运行中", completed: "已完成", failed: "失败", stopped: "已停止", pending: "待启动" };
  var GATES = {
    passed: "passed", pass: "passed", "通过": "passed", ok: "passed", success: "passed",
    failed: "failed", fail: "failed", "未通过": "failed", error: "failed",
    running: "running", "运行中": "running",
    pending: "pending", "待运行": "pending", waiting: "pending",
    not_run: "not_run", notrun: "not_run", skipped: "not_run", "未运行": "not_run", none: "not_run", off: "not_run"
  };
  var SEG_COLORS = { passed: "var(--green, var(--primary))", failed: "var(--red, var(--destructive))", rework: "var(--yellow, var(--orange))", working: "var(--blue, var(--primary))", reviewing: "var(--blue, var(--primary))", pending: "var(--muted-foreground, #999)" };

  function findingText(f) {
    if (f === null || f === undefined) return "";
    if (typeof f === "string") return f;
    var what = pick(f, ["what", "message", "note", "text", "title", "summary"]) || "未说明";
    var where = pick(f, ["where", "card", "card_id", "scope"]);
    var status = pick(f, ["status"]);
    var st = status === "verified" ? "已核实" : status === "unconfirmed" ? "待核实" : status;
    var suffix = [where, st].filter(Boolean).join(" · ");
    return what + (suffix ? "（" + suffix + "）" : "");
  }

  function toMs(v) {
    if (typeof v === "number" && isFinite(v) && v > 0) return v;
    if (typeof v === "string") { var n = Number(v); if (isFinite(n) && n > 0) return n; var t = Date.parse(v); if (!isNaN(t)) return t; }
    return 0;
  }
  function fmtDur(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return s + " 秒";
    var m = Math.floor(s / 60); s %= 60;
    if (m < 60) return m + " 分 " + s + " 秒";
    var h = Math.floor(m / 60); m %= 60;
    return h + " 时 " + m + " 分";
  }
  function elapsedText(run, d) {
    var ms = pick(run, ["elapsed_ms", "elapsedMs", "elapsed"]) || pick(d || {}, ["elapsed", "elapsed_ms", "elapsedMs"]);
    if (typeof ms === "number" && isFinite(ms) && ms >= 0) return fmtDur(ms);
    if (typeof ms === "string" && ms) { var n = Number(ms); if (isFinite(n) && n >= 0) return fmtDur(n); return (ms === "n/a" || ms === "-") ? "" : ms; }
    var start = toMs(pick(run, ["started_at", "startedAt", "start", "start_time"]));
    var end = toMs(pick(run, ["updated_at", "updatedAt", "end", "end_time"])) || Date.now();
    if (start && end >= start) return fmtDur(end - start);
    return "";
  }
  function gateSummary(gate, raw) {
    if (!gate) return "无验证命令";
    var g = GATES[String(raw == null ? "" : raw).trim().toLowerCase()];
    if (g === "passed") return "gate 通过";
    if (g === "failed") return "gate 未通过";
    if (g === "running") return "gate 运行中";
    if (g === "not_run") return "gate 未运行";
    if (g === "pending") return "gate 待运行";
    return raw ? "gate：" + cut(String(raw), 40) : "gate 待运行";
  }

  /* 展开状态：同一次渲染实例内保留（宿主重新加载新卡片文件时自然复位） */
  var expanded = Object.create(null);

  function iconCaret() { return svgIcon(14, 1.8, [["path", { d: "M5 6l2.5 2.5L10 6" }]]); }

  /** 详情分组：标题 + 文本/列表；全部 textContent。 */
  function dsec(title, items, opts) {
    var list = Array.isArray(items) ? items.filter(function (x) { return x != null && String(x).trim() !== ""; }) : [];
    if (!list.length) return null;
    var box = el("div", "zb-dsec");
    box.appendChild(el("h6", "zb-dsec-title", title));
    if (opts && opts.text) { box.appendChild(el("p", "zb-dsec-text", String(list[0]))); return box; }
    var ul = el("ul", "zb-dlist");
    list.forEach(function (item) { ul.appendChild(el("li", null, String(item))); });
    box.appendChild(ul);
    return box;
  }

  /** 卡片详情：容错消费 buildBoardData 的详情字段（有则显示，无则跳过）。 */
  function stateLabelSt(st) { return STATE_LABEL[st] || st; }
  function detailNode(card) {
    var box = el("div", "zb-detail");
    var role = pick(card, ["role"]);
    var st = normStatus(pick(card, ["status", "stage", "state"]));
    var rework = Number(pick(card, ["rework", "reworks", "rework_rounds", "reworkRounds", "rounds", "round"]) || 0) || 0;
    var noteFull = String(pick(card, ["note", "latest_note", "last_note", "summary", "detail", "comment"]) || "");
    [
      dsec("任务", [pick(card, ["task"])], { text: true }),
      dsec("写入范围", card.scope ? [card.scope] : []),
      dsec("验收标准", [pick(card, ["acceptance"])], { text: true }),
      dsec("结果", [pick(card, ["summary"])], { text: true }),
      dsec("检查项", Array.isArray(card.checks) ? card.checks.slice(0, 30).map(String) : []),
      dsec("改动文件", Array.isArray(card.changed) ? card.changed.slice(0, 30).map(String) : []),
      dsec("审查意见", Array.isArray(card.review_findings) ? card.review_findings.slice(0, 15).map(String) : []),
      dsec("待处理", Array.isArray(card.open_items) ? card.open_items.slice(0, 15).map(String) : []),
      dsec("错误", card.error ? [card.error] : [], { text: true })
    ].forEach(function (sec) { if (sec) box.appendChild(sec); });
    var metaBits = [];
    var rp = pick(card, ["review_pass", "reviewPass"]);
    if (rp === true) metaBits.push("审查通过");
    if (rp === false) metaBits.push("审查未通过");
    var bn = Number(pick(card, ["bounces"]) || 0); if (bn > 0) metaBits.push("打回 " + bn + " 批");
    var sp = Number(pick(card, ["spawns"]) || 0); if (sp > 0) metaBits.push("扩编 " + sp + " 张");
    var launched = pick(card, ["launched_at", "launchedAt"]); if (launched) metaBits.push("开始 " + launched);
    var completed = pick(card, ["completed_at", "completedAt"]); if (completed) metaBits.push("完成 " + completed);
    if (metaBits.length) box.appendChild(el("div", "zb-dmeta", metaBits.join(" · ")));
    if (box.childElementCount > 0) return box;
    /* 兜底：结构化详情字段还没进数据（旧链路/过渡期）时，也保证卡片可点开看基本信息 */
    var fallbackBits = [];
    if (role) fallbackBits.push("角色：" + role);
    if (st) fallbackBits.push("状态：" + (stateLabelSt(st)));
    if (rework > 0) fallbackBits.push("返工 " + rework + " 轮");
    if (noteFull) fallbackBits.push("摘要：" + noteFull);
    if (!fallbackBits.length) return null;
    box.appendChild(el("div", "zb-dmeta", fallbackBits.join(" · ")));
    return box;
  }

  function cardNode(card, idx) {
    var st = normStatus(pick(card, ["status", "stage", "state"]));
    var key = String(pick(card, ["id", "no", "num"]) || pick(card, ["title", "name"]) || idx);
    var id = pick(card, ["id", "no", "num"]) || "?";
    var title = pick(card, ["title", "name"]) || "(无标题)";
    var role = pick(card, ["role"]);
    var rework = Number(pick(card, ["rework", "reworks", "rework_rounds", "reworkRounds", "rounds", "round"]) || 0) || 0;
    var note = String(pick(card, ["note", "latest_note", "last_note", "summary", "detail", "comment"]) || "");
    var rawLabel = String(pick(card, ["state_label", "stateLabel"]) || "");
    var stateLabel = rawLabel.trim() ? rawLabel : (STATE_LABEL[st] || "");
    var hasDetail = Boolean(detailNode(card));

    var row = document.createElement("button");
    row.type = "button";
    row.className = "zb-row";
    row.setAttribute("data-status", st);
    row.style.animationDelay = (0.08 + Math.min(idx, 12) * 0.045) + "s";
    var isOpen = Boolean(expanded[key]);
    if (isOpen) row.setAttribute("data-open", "true");
    row.setAttribute("aria-expanded", isOpen ? "true" : "false");

    var icon = el("span", "zb-icon");
    icon.setAttribute("role", "img");
    icon.setAttribute("aria-label", STATE_LABEL[st] || "状态");
    icon.appendChild(iconOf(st));

    var l1 = el("div", "zb-l1");
    l1.appendChild(el("span", "zb-id", "#" + id));
    var t = el("span", "zb-title", cut(title, 60));
    if (String(title).length > 60) t.setAttribute("title", title);
    l1.appendChild(t);
    l1.appendChild(el("span", "zb-state", stateLabel));
    if (hasDetail) { var c = el("span", "zb-caret"); c.setAttribute("aria-hidden", "true"); c.appendChild(iconCaret()); l1.appendChild(c); }

    var l2 = el("div", "zb-l2");
    if (role) l2.appendChild(el("span", "zb-role", cut(role, 20)));
    if (rework > 0) l2.appendChild(el("span", "zb-rework-tag", "↻" + rework));
    if (note) {
      var nl = el("span", "zb-note-line", cut(note, 90));
      nl.setAttribute("title", note);
      l2.appendChild(nl);
    }

    var main = el("div");
    main.style.setProperty("display", "grid");
    main.style.setProperty("gap", "1px");
    main.appendChild(l1); main.appendChild(l2);

    row.appendChild(icon);
    row.appendChild(main);

    if (hasDetail) {
      row.addEventListener("click", function () {
        var now = !expanded[key];
        if (now) expanded[key] = true; else delete expanded[key];
        var fresh = cardNode(card, idx);
        var detail = detailNode(card);
        /* 展开态：详情插到这行后面（网格内跨列）；收起态：只还原行本身 */
        if (now && detail) {
          var cell = el("div", "zb-cell");
          cell.style.setProperty("grid-column", "1 / -1");
          cell.appendChild(fresh);
          cell.appendChild(detail);
          row.parentNode.replaceChild(cell, row);
        } else if (row.parentNode && row.parentNode.classList.contains("zb-cell")) {
          row.parentNode.parentNode.replaceChild(fresh, row.parentNode);
        } else {
          row.parentNode.replaceChild(fresh, row);
        }
      });
    } else {
      row.style.cursor = "default";
      row.setAttribute("aria-expanded", "false");
    }
    return row;
  }

  var GRID_GAP_HACK = 0; /* 保留占位，避免下方锚点误删 */

  function render() {
    var d = DATA || {};
    var run = d.run || {};
    var runStatus = RUNS[String(pick(run, ["status", "state"]) || pick(d, ["status", "state"])).trim().toLowerCase()] || "";
    var badge = need($("zb-run"), "zb-run");
    if (runStatus) {
      badge.hidden = false;
      badge.setAttribute("data-run", runStatus);
      badge.textContent = RUN_LABEL[runStatus] || runStatus;
    } else badge.hidden = true;
    var runId = String(pick(run, ["run_id", "runId", "id"]) || "");
    var runidEl = $("zb-runid"); if (runidEl) runidEl.textContent = runId ? runId : "";

    var cards = d.cards || [];
    /* 计数：优先数据自带 counts（与面板同源），缺了再现场数 */
    var counts = { passed: 0, failed: 0, working: 0, reviewing: 0, rework: 0, pending: 0 };
    var rawCounts = d.counts && typeof d.counts === "object" ? d.counts : null;
    var hasCounts = false;
    for (var k in counts) { var v = rawCounts ? Number(rawCounts[k]) : NaN; if (isFinite(v) && v >= 0) { counts[k] = v; hasCounts = true; } }
    if (!hasCounts) cards.forEach(function (c) { counts[normStatus(pick(c, ["status", "stage", "state"]))] += 1; });
    var total = cards.length || (counts.passed + counts.failed + counts.working + counts.reviewing + counts.rework + counts.pending);

    /* 结算比大数字 */
    var nums = $("zb-nums"); if (!nums) nums = { textContent: "", appendChild: function () {}, setAttribute: function () {} };
    nums.textContent = "";
    nums.appendChild(document.createTextNode(String(counts.passed + counts.failed)));
    var den = el("span", "zb-den", "/" + total);
    nums.appendChild(den);
    nums.setAttribute("data-all", total > 0 && counts.passed === total ? "true" : "false");
    nums.setAttribute("data-anyfail", counts.failed > 0 ? "true" : "false");

    /* 副行：运行阶段提示 + gate */
    var gateObj = d.gate && typeof d.gate === "object" ? d.gate : null;
    var gateCmd = gateObj ? String(pick(gateObj, ["command", "cmd", "gate"]) || "") : String(d.gate || "");
    var gateRaw = d.gate_status || d.gateStatus || (gateObj ? pick(gateObj, ["status", "state"]) : "");
    var dur = elapsedText(run, d);
    var subBits = [];
    var openN = counts.working + counts.reviewing + counts.rework + counts.pending;
    if (runStatus === "running" && openN > 0) {
      if (counts.working + counts.rework > 0) subBits.push("施工中 " + (counts.working + counts.rework));
      else if (counts.reviewing > 0) subBits.push("审查中 " + counts.reviewing);
      else subBits.push("待派工 " + counts.pending);
    }
    subBits.push(gateSummary(gateCmd, gateRaw));
    if (dur) subBits.push(dur);
    $("zb-sub").textContent = subBits.join(" · ");

    /* 分段条 + 图例 */
    var segbar = $("zb-segbar"); if (!segbar) segbar = { textContent: "", appendChild: function () {} };
    var legend = $("zb-legend"); if (!legend) legend = { textContent: "", appendChild: function () {} };
    segbar.textContent = ""; legend.textContent = "";
    var order = ["passed", "working", "reviewing", "rework", "pending", "failed"];
    order.forEach(function (k, i) {
      if (counts[k] > 0) {
        var seg = el("span", "zb-seg");
        seg.setAttribute("data-k", k);
        seg.style.flexGrow = String(counts[k]);
        seg.style.animationDelay = (0.1 + i * 0.06) + "s";
        if (k === "working" || k === "reviewing") seg.style.backgroundSize = "16px 100%";
        segbar.appendChild(seg);
        var li = el("span");
        var dot = el("i", "zb-dot");
        dot.style.background = SEG_COLORS[k];
        li.appendChild(dot);
        li.appendChild(document.createTextNode(STATE_LABEL[k] + " "));
        li.appendChild(el("b", null, String(counts[k])));
        legend.appendChild(li);
      }
    });

    /* 卡片网格 */
    var grid = $("zb-cards"); if (!grid) grid = { textContent: "", appendChild: function () {} };
    grid.textContent = "";
    if (cards.length) cards.forEach(function (c, i) { grid.appendChild(cardNode(c, i)); });
    else grid.appendChild(el("p", "zb-empty", "暂无看板数据"));

    /* 设计文档徽标 */
    var designMd = pick(d, ["design_md", "designMd", "design"]);
    $("zb-design").hidden = !String(designMd || "").trim();

    /* 等你处理（原生折叠） */
    var findings = d.findings || [];
    var fCount = findings.length || Number(pick(d, ["findings_count", "findingsCount", "finding_count"]) || 0) || 0;
    var bar = $("zb-findings");
    if (fCount) {
      bar.hidden = false;
      $("zb-findings-count").textContent = "等你处理 " + fCount + " 项";
      var ul = $("zb-findings-list");
      ul.textContent = "";
      if (findings.length) findings.forEach(function (f) { ul.appendChild(el("li", null, cut(findingText(f), 120))); });
      else ul.appendChild(el("li", null, "详情见最终施工报告"));
    } else bar.hidden = true;

    /* 底部摘要（等宽小字） */
    var parts = [];
    if (total) parts.push("已结算 " + (counts.passed + counts.failed) + "/" + total);
    if (gateCmd) parts.push("$ " + cut(gateCmd, 48));
    var artifactDir = String(pick(d, ["artifact_dir", "artifactDir", "artifacts_dir", "artifactsDir"]) || "");
    if (artifactDir) parts.push("产物已归档");
    var summaryEl = $("zb-summary");
    summaryEl.textContent = parts.join("  ·  ") || "等待数据";
    if (artifactDir) summaryEl.setAttribute("title", "产物目录：" + artifactDir);
    else summaryEl.removeAttribute("title");
  }

  /* 侧栏看板按钮：尝试经宿主桥唤起「团队看板」面板；桥不可用则降级为文字提示。
     宿主对聊天卡片提供的桥方法名未公开，这里对 MCP-Apps 常见方法名逐一尝试。 */
  /* 大视图切换：data-zoom 驱动 CSS 过渡（字号/间距/段条平滑放大） */
  var zoomBtn = $("zb-zoom"); /* 可选元素：被清洗也不影响主渲染 */
  if (zoomBtn) {
    zoomBtn.addEventListener("click", function () {
      var on = root.getAttribute("data-zoom") === "true";
      if (on) root.removeAttribute("data-zoom"); else root.setAttribute("data-zoom", "true");
      zoomBtn.setAttribute("aria-pressed", on ? "false" : "true");
    });
  }

  try {
    render();
  } catch (err) {
    /* 宿主环境异常不再静默白卡：把崩因显示在卡片里，一眼可诊断 */
    try {
      var errBox = document.createElement("p");
      errBox.className = "zb-summary";
      errBox.style.color = "var(--red, var(--destructive))"
      errBox.textContent = "看板渲染异常：" + (err && err.message ? err.message : err);
      (root || document.body).appendChild(errBox);
    } catch (e2) { /* 连兜底都失败就随它去 */ }
  }
})();
</script>
</div>
